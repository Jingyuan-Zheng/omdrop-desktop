name: Frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin python3-gi python3-nautilus gir1.2-nautilus-4.0 gir1.2-gtk-4.0 xvfb dbus-x11
      - name: Offline tests
        run: make test
      - name: GTK4 fixture test
        run: dbus-run-session -- sh scripts/test-ui.sh
      - name: Build archives and inspect release contents
        run: |
          /usr/bin/python3 tools/manage.py package
          /usr/bin/python3 tools/check_release.py
